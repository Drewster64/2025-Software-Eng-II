<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    .bi-star {
      font-size: 30px;
      color: #ccc;
      cursor: pointer;
    }
    .bi-star-fill {
      color: gold;
    }
  </style>
</head>
<body class="page">
  <div class="container-fluid text-center mt-5 rounded content">
    <h1 id="titulo-cancion" class="mb-4 fw-bolder"></h1>

    <img id="cover-cancion" class="img-fluid rounded shadow" style="max-height: 400px;" alt="Cover de la canción" />

    <!-- Sistema de Reseñas con Estrellas -->
    <div id="rating-container" class="mt-4">
      <h3>Califica esta canción:</h3>
      <div id="estrellas" class="mb-3">
        <span class="bi bi-star" data-index="0"></span>
        <span class="bi bi-star" data-index="1"></span>
        <span class="bi bi-star" data-index="2"></span>
        <span class="bi bi-star" data-index="3"></span>
        <span class="bi bi-star" data-index="4"></span>
      </div>
      <button id="submit-rating" class="btn btn-primary">Enviar Estrellas</button>
    </div>

    <!-- Promedio de calificación -->
    <div class="mt-4">
      <h4>
        Promedio de Calificación: 
        <span id="average-rating">Cargando...</span> 
        <i class="bi bi-star-fill text-warning"></i>
      </h4>
    </div>
  </div>

  <script type="module" src="./song.js"></script>
</body>
</html>
