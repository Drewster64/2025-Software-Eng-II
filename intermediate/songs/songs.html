<!--Frankenstein V1-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canción</title>
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons para el sistema de estrellas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
      <script>
        function redirigirAHome() {
        const pathSegments = window.location.pathname.split("/");
        const repoName = pathSegments.length > 1 ? pathSegments[1] : "";
        const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        const homeURL = isLocal
        ? `${window.location.origin}/home.html`
        : `${window.location.origin}/${repoName}/home.html`;

        window.location.href = homeURL;
}

        
    </script>

    <style>
      /* Estilos para el sistema de calificación por estrellas */
      .bi-star {
        font-size: 30px;
        color: #ccc;
        cursor: pointer;
      }
      .bi-star-fill {
        color: gold;
      }
    </style>
  </head>
  <body class="page">
    <!-- Contenedor de la canción -->
    <div class="container-fluid text-center mt-5 rounded content">
      <nav class="navbar navbar-expand-lg navbar-light navcolor fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="/home.html">
                    <img class="rounded" src="/images/logo1.webp" alt="Bootstrap" width="80" height="80">
                </a>
                <a class="navbar-brand bi bi-chevron-double-up text" href="#home"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="javascript:void(0);" onclick="redirigirAHome()"><b><h4 class="text-dark fw-bolder">Home</h4></b></a>
                        <a class="nav-link" href="#review"><b><h4 class="text-dark fw-bolder">Reseñas</h4></b></a>
                        <a class="nav-link" href="#song"><b><h4 class="text-dark fw-bolder">Canción</h4></b></a>
                        <div class="d-flex flex-column align-items-center w-100 mt-3">
                            <form id="search-form" class="d-flex align-items-center mb-2" role="search">
                              <input type="search" id="search-input" class="form-control me-2" placeholder="Busca una canción..." required>
                              <button class="btn btn-info" type="submit"><i class="bi bi-search"></i></button>
                            </form>  
                            <button id="logout-btn" class="btn btn-danger btn-sm w-auto">
                              <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                            </button>
                          </div>                 
                   
                    </div>
                </div>
            </div>
        </nav>
        <section id="song" class="padding-top:100px;">

      <h1 id="titulo-cancion" class="mb-4 fw-bolder "></h1>
      <img id="cover-cancion" class="img-fluid rounded shadow" style="max-height: 400px;" alt="Cover de la canción" />

      <!-- Sistema de calificación con estrellas -->
      <div id="rating-container" class="mt-4">
        <h3>Califica esta canción:</h3>
        <div id="estrellas" class="mb-3">
          <span class="bi bi-star" data-index="0"></span>
          <span class="bi bi-star" data-index="1"></span>
          <span class="bi bi-star" data-index="2"></span>
          <span class="bi bi-star" data-index="3"></span>
          <span class="bi bi-star" data-index="4"></span>
        </div>
      </div>
        </section>

      <section id="review"></section>

      <!-- Sección para mostrar el promedio de calificación --> 
      <div class="mt-4">
        <h4>
          Promedio de Calificación:
          <span id="average-rating">Cargando...</span>
          <i class="bi bi-star-fill text-warning"></i>
        </h4>
      </div>
    </div>

    <!-- Sección de reseñas -->
     
    <div class="card mt-4">
      <div class="card-header">
        <h1>Haz una reseña</h1>
      </div>
      <div class="card-body">
        <form id="review-form" class="row g-3">
          <div class="col-md-4">
            <input type="text" id="reviewer-name" class="form-control" placeholder="Tu nombre" readonly />
          </div>
          <div class="col-md-5">
            <input type="text" id="review-text" class="form-control" placeholder="Tu reseña" required />
          </div>
          <div class="col-md-1">
            <button type="submit" id="submit-rating" class="btn btn-success w-100">Enviar</button>
          </div>
        </form>
        <div id="reviews-container" class="mt-4">
          <h3>Reseñas</h3>
          <!-- Aquí se cargarán las reseñas existentes -->
        </div>
      </div>
    </div>

    <script>
      // Aseguramos que el nombre del usuario asignado en localStorage se refleje en el input correspondiente.
      const user = localStorage.getItem("loggedInUser");
      document.getElementById("reviewer-name").value = user || "";
    </script>
    <!-- Importamos el módulo de JavaScript que gestiona la canción, las reseñas y la calificación -->
    <script type="module" src="./song.js"></script>
  </body>
</html>
